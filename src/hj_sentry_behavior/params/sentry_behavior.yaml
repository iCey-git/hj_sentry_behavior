bt_action_server:
  ros__parameters:
    use_sim_time: false
    action_name: pb2025_sentry_behavior         # Optional
    tick_frequency: 5                          # Optional (defaults to 100 Hz)
    groot2_port: 1667                           # Optional (defaults to 1667)
    ros_plugins_timeout: 1000                   # Optional (defaults 1000 ms)
    use_cout_logger: false                      # Optional (defaults to false)

    plugins:
      - pb2025_sentry_behavior/bt_plugins

    behavior_trees:
      - pb2025_sentry_behavior/behavior_trees

    CalculateAttackPose:
      attack_radius: 2.0                        # 攻击半径（米）
      num_sectors: 36                           # 扇区划分数量
      cost_threshold: 50                        # 栅格的占用概率，大于该值将被视为障碍物 [0, 100]
      robot_base_frame: base_footprint          # 修改为匹配导航系统
      visualize: true


    # 导航目标（格式: "x;y;yaw"）
    supply_goal: "-0.8219258189201355;-6.722344398498535;0"
    base_protect_goal: "4.406850814819336;-0.8306994438171387;0"
    outpost_pressure_goal: "8.46983528137207;3.1363728046417236;0"

    post_outpost_behavior_mode: "default_patrol"  # default_patrol / hold_point / alt_patrol
    patrol_point_a_goal: "12.890176773071289;1.1806282997131348;0"
    patrol_point_b_goal: "8.120878219604492;-3.140058994293213;0"
    post_outpost_alt_point_a_goal: "10.530373573303223;2.9102365970611572;0"
    post_outpost_alt_point_b_goal: "8.303040504455566;-3.1416804790496826;0"
    post_outpost_hold_goal: "11.39123249053955;2.5960257053375244;0"
    enemy_outpost_gain_point: "12.43687629699707;3.2079238891601562;0"
    single_goal_refresh_sec: 10.0
    our_side: "blue"                           # red / blue / auto(auto 预留，当前未实现)
    field_length_m: 28.0
    field_width_m: 15.0
    manual_nav_map_offset_x: -3.68
    manual_nav_map_offset_y: -8.46
    manual_nav_goal_yaw: 0.0

    # 补给参数
    supply_ammo_min: 50                         # 弹药低于此值触发补给
    supply_hp_min: 200                          # HP 低于此值触发补给
    supply_hp_recover: 360                      # HP 恢复到此值才解除补给状态

    # 区域边界
    supply_our_half_polygon: "8.798,4.567;5.648,-0.036;5.610,-1.430;6.754,-4.599;-3.758,-4.613;-3.632,1.631;3.980,1.861;6.382,5.331;8.557,5.384"
    rough_road_polygon: "7.038,-6.356;7.076,-8.283;0.121,-8.330;0.106,-5.781;1.528,-5.804;1.572,-6.339"
    highland_polygon: "14.335,4.353;14.102,-2.893;11.640,-6.176;9.483,-6.189;9.500,-8.365;6.708,-8.339;6.579,0.854;8.942,4.304;12.047,4.467"
    rough_home_side_anchor: "1.4000000000000000;-7.4000000000000000;0"
    rough_highland_side_anchor: "5.6000000000000000;-7.4000000000000000;0"
    rough_direct_drive_polygon: "1.55,-6.46;4.33,-6.43;4.33,-8.33;1.52,-8.29"
    rough_direct_drive_enabled: true # 开启则直接给底盘发速度 开环控制过颠簸路段
    rough_cross_timeout_sec: 10.0
    home_to_highland_vx: 2.0
    home_to_highland_vy: 0.0
    home_to_highland_vyaw: 0.0
    highland_to_home_vx: -2.0
    highland_to_home_vy: 0.0
    highland_to_home_vyaw: 0.0

    # 保卫基地参数
    base_protect_hp_threshold: 1500             # 我方基地 HP 低于此值则切入守基地模式

    # 姿态切换参数 1=进攻, 3=移动
    posture_cooldown_sec: 5.0                   # 每次切换姿态后的冷却时间
    posture_enemy_stale_timeout_sec: 0.3        # 视觉敌人消息超时
    posture_enemy_max_distance: 8.0             # 进入进攻姿态的最大敌人距离
    posture_linger_sec: 5.0                     # 敌人消失后的进攻姿态滞留时间

sentry_behavior_client:
  ros__parameters:
    use_sim_time: false
    target_tree: rmuc_2026
    # target_tree: test_spin_nav_aim
mapping_bag_recorder:
  ros__parameters:
    competition_topic: /competition_info
    script_path: /home/hj/sentry_nav_26/record_mapping_bag.sh
    start_game_state: 2
    stop_game_state: 5
    stop_timeout_sec: 20.0
